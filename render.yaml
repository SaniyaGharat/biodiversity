services:
  - type: web
    name: daaruka-biodiversity
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn daaruka.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHROMA_PERSIST_DIRECTORY
        value: ./chroma_data
      - key: CHROMA_COLLECTION_NAME
        value: biodiversity_knowledge
